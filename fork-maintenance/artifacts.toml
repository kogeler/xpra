# Permanent storage classes, not a list of sessions, cycles, dates, or runs.
schema = 2

# The only content that survives `artifacts-close`: the distilled session
# records and their generated registry. Its layout is validated; it never
# holds raw logs, reports, screenshots or copies of results.
permanent = [
  "knowledge",
]

# Lifecycle/recovery authorities and their lock files. Both scopes keep them;
# `artifacts-close` additionally requires every file below them to be an idle
# empty lock, so an unfinished job or transaction blocks the close.
infrastructure = [
  "cycle-cleanups",
  "upstream-tests/runs",
  "upstream-tests/image-builds",
  "upstream-tests/.foreground-payload",
  "upstream-tests/.foreground-payload.owner.json",
  "upstream-tests/.foreground-payload.lock",
  "upstream-tests/logs/.lifecycle.lock",
  "jobs/live/.lifecycle.lock",
  "deb-packages/runs",
  "deb-packages/locks/terminal.lock",
  "deb-packages/releases",
]

# Session state: the open session's working ledger/scratch and reusable
# caches. Mid-session `artifacts-clean` keeps them; `artifacts-close` removes
# them. Adding a new runtime root requires updating this policy and its
# ownership tests before the producer is enabled.
task = [
  "work",
  "build-contexts",
  "source-archives",
  "tooling-venv",
  "venvs",
  "upstream-tests/sources",
  "deb-packages/sources",
  "deb-packages/selections",
  "deb-packages/locks/images",
]

# Structural parents stay, but their children are disposable unless classified
# above or protected by a runtime owner.
containers = [
  "jobs",
  "jobs/live",
  "live-results",
  "upstream-tests",
  "upstream-tests/logs",
  "deb-packages",
  "deb-packages/locks",
  "deb-packages/results",
  "deb-packages/outputs",
]
